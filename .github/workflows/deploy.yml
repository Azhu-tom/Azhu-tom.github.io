# GitHub Pages 自动部署工作流
# 每次推送 main → 自动构建 → 复制到 docs/ → GitHub Pages 服务 docs/
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 权限设置
permissions:
  contents: write   # 需要 write 才能 push docs/ 目录
  pages: write
  id-token: write

# 防止并发部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Detect base path
        id: detect-base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> $GITHUB_OUTPUT
          else
            echo "base=/$REPO/" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: cd client && npm run build
        env:
          VITE_BASE_PATH: ${{ steps.detect-base.outputs.base }}

      - name: Copy dist to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r client/dist/* docs/
          # 创建 .nojekyll 防止 Jekyll 忽略带下划线的文件
          touch docs/.nojekyll
          echo "✅ docs/ ready: $(find docs -type f | wc -l) files"

      - name: Commit docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ci: deploy build artifacts to docs/"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (backup)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4