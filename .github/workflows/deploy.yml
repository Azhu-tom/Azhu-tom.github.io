# GitHub Pages 自动部署工作流
# 每次推送 main 分支 → 自动构建 + 部署到 Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

# 权限设置（GitHub Pages 所需）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Detect base path
        id: detect-base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            # 用户级 Pages 仓库（如 azhu-tom.github.io）→ 根 URL
            echo "base=/" >> $GITHUB_OUTPUT
          else
            # 项目级 Pages 仓库 → 子路径
            echo "base=/$REPO/" >> $GITHUB_OUTPUT
          fi

      - name: Build (with GitHub Pages base path)
        run: cd client && npm run build
        env:
          # 用户级仓库 base=/  → https://用户名.github.io/
          # 项目级仓库 base=/仓库名/ → https://用户名.github.io/仓库名/
          VITE_BASE_PATH: ${{ steps.detect-base.outputs.base }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
